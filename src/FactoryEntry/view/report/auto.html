<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>自动续期控制台</title>
    <link rel="stylesheet" href="/lib/css/bootstrap.min.css">
    <link rel="stylesheet" href="/FactoryEntry/assets/css/auto.css">
    <style>
        /* 小屏：5 个入口等分一行，字号收紧，不横向溢出 */
        @media (max-width: 520px) {
            .navbar { padding: .3rem 0; }
            .navbar > .container { justify-content: stretch !important; padding-left: 6px; padding-right: 6px; }
            .navbar .nav-pills { flex-wrap: nowrap; gap: 2px !important; width: 100%; }
            .navbar .nav-item { flex: 1 1 0; min-width: 0; }
            .navbar .nav-link {
                display: flex; align-items: center; justify-content: center;
                padding: .34rem .08rem; font-size: .78rem; line-height: 1.2;
                white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            }
        }
    </style>
</head>
<body class="bg-light">
        <nav class="navbar navbar-expand navbar-light bg-white shadow-sm mb-4">
        <div class="container justify-content-center">
            <ul class="nav nav-pills gap-1">
                <li class="nav-item"><a class="nav-link" href="/">🏠 首页</a></li>
                <li class="nav-item"><a class="nav-link" href="/FactoryEntry/Report/debug.html">🔧 报备调试</a></li>
                <li class="nav-item"><a class="nav-link active" href="/FactoryEntry/Report/auto.html">🚀 自动续期</a></li>
                <li class="nav-item"><a class="nav-link" href="/FactoryEntry/Query/visitor.html">👥 访客通</a></li>
                <li class="nav-item"><a class="nav-link" href="/FactoryEntry/Log/log.html">📊 日志</a></li>
            </ul>
        </div>
    </nav>
    <div class="container">
        <h1 class="h4 border-start border-4 border-primary ps-2">🚀 自动续期控制台</h1>
        <div class="d-flex gap-2 align-items-center mb-3 flex-wrap">
            <select id="locFilter" class="form-select w-auto"><option value="">全部厂区</option></select>
            <button class="btn btn-warning" onclick="startAuto(true)">🧪 干跑模拟（不发包）</button>
            <button class="btn btn-danger" onclick="startAuto(false)">⚠️ 开始真实续期（会发包）</button>
        </div>
        <div id="status" class="alert alert-secondary mb-3">就绪</div>
        <div class="card mb-3">
            <div class="card-header fw-semibold">📋 实时日志</div>
            <div id="log" class="log"></div>
        </div>
        <div class="card">
            <div class="card-header fw-semibold">📦 发包结果</div>
            <div id="results" class="card-body"></div>
        </div>
    </div>
    <script src="/lib/js/bootstrap.bundle.min.js"></script>
    <script src="/FactoryEntry/assets/js/auto.js"></script>
</body>
</html>
