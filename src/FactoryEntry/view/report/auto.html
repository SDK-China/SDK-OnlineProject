<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自动续期控制台</title>
    <link rel="stylesheet" href="/FactoryEntry/assets/css/auto.css">
</head>
<body>
    <nav class="topnav">
        <a href="/FactoryEntry/Report/debug.html">🔧 报备调试</a>
        <a href="/FactoryEntry/Report/auto.html" class="active">🚀 自动续期</a>
        <a href="/FactoryEntry/Query/visitor.html">👥 访客通</a>
        <a href="/FactoryEntry/Log/log.html">📊 日志</a>
    </nav>

    <div class="container">
        <h1>🚀 自动续期控制台</h1>
        <div class="controls">
            <select id="locFilter"><option value="">全部厂区</option></select>
            <button class="btn-dry" onclick="startAuto(true)">🧪 干跑模拟（不发包）</button>
            <button class="btn-start" onclick="startAuto(false)">⚠️ 开始真实续期（会发包）</button>
        </div>
        <div id="status" class="status">就绪</div>
        <div class="panel">
            <div class="panel-title">📋 实时日志</div>
            <div id="log" class="log"></div>
        </div>
        <div class="panel">
            <div class="panel-title">📦 发包结果</div>
            <div id="results"></div>
        </div>
    </div>
    <script src="/FactoryEntry/assets/js/auto.js"></script>
</body>
</html>
