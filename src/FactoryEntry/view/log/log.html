<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀 Factory Auto-Renew 日志控制台</title>
    <link rel="stylesheet" href="/lib/css/bootstrap.min.css">
    <link rel="stylesheet" href="/lib/css/atom-one-dark.min.css">
    <link rel="stylesheet" href="/FactoryEntry/assets/css/log.css">
</head>
<body class="bg-light">
        <nav class="navbar navbar-expand navbar-light bg-white shadow-sm mb-4">
        <div class="container justify-content-center">
            <ul class="nav nav-pills gap-1">
                <li class="nav-item"><a class="nav-link" href="/FactoryEntry/Report/debug.html">🔧 报备调试</a></li>
                <li class="nav-item"><a class="nav-link" href="/FactoryEntry/Report/auto.html">🚀 自动续期</a></li>
                <li class="nav-item"><a class="nav-link" href="/FactoryEntry/Query/visitor.html">👥 访客通</a></li>
                <li class="nav-item"><a class="nav-link active" href="/FactoryEntry/Log/log.html">📊 日志</a></li>
            </ul>
        </div>
    </nav>
    <div class="container">
        <div class="card mb-3">
            <div class="card-body d-flex flex-column flex-md-row justify-content-between align-items-center gap-3">
                <div>
                    <h1 class="h5 mb-1">📊 智能运行日志中枢</h1>
                    <p class="text-muted small mb-0">深度解析 UI生成、手动发送、自动续期的底层报文</p>
                </div>
                <div class="d-flex gap-2">
                    <button class="btn btn-primary" onclick="fetchLogs()">🔄 刷新数据</button>
                    <button class="btn btn-outline-danger" onclick="clearLogs()">🗑️ 清空日志</button>
                </div>
            </div>
        </div>

        <div class="card mb-3">
            <div class="card-body d-flex flex-wrap gap-3 align-items-center">
                <div class="form-check mb-0">
                    <input type="checkbox" class="form-check-input" id="selectAllCb" onclick="selectAllFiltered(event)">
                    <label for="selectAllCb" class="form-check-label small fw-semibold">全选当前</label>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <label class="small text-muted text-nowrap mb-0">时间维度:</label>
                    <select id="timeFilter" class="form-select form-select-sm" onchange="renderLogs()">
                        <option value="all">📅 全部展现</option>
                        <option value="today">⚡ 仅看今日</option>
                        <option value="history">🕰️ 历史 (1970年至今旧数据)</option>
                    </select>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <label class="small text-muted text-nowrap mb-0">操作类型:</label>
                    <select id="actionFilter" class="form-select form-select-sm" onchange="renderLogs()">
                        <option value="all">全部类型</option>
                        <option value="UI生成">UI生成</option>
                        <option value="手动发送">手动发送</option>
                        <option value="自动续期">自动续期</option>
                    </select>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <label class="small text-muted text-nowrap mb-0">搜索:</label>
                    <input type="text" id="searchInput" class="form-control form-control-sm" onkeyup="renderLogs()" placeholder="输入关键字...">
                </div>
                <div class="ms-auto small text-muted">
                    共找到 <span id="logCount" class="fw-bold fs-5 text-primary">0</span> 条记录
                </div>
            </div>
        </div>

        <div id="logContainer" class="d-flex flex-column gap-3 pb-5">
            <div class="text-center text-muted py-5">加载中...</div>
        </div>

        <div id="bulkActionBar" class="bulk-bar">
            <span class="small">已选中 <span id="bulkCount" class="fw-bold">0</span>项</span>
            <button class="btn btn-sm btn-danger" onclick="deleteSelected()">🗑️ 永久删除</button>
        </div>
    </div>
    <script src="/lib/js/bootstrap.bundle.min.js"></script>
    <script src="/lib/js/highlight.min.js"></script>
    <script src="/FactoryEntry/assets/js/log.js"></script>
</body>
</html>
